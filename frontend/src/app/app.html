@if (profile(); as p) {
  <app-hero [profile]="p" />

  <main>
    <app-about [paragraphs]="p.about" />
    <app-projects [projects]="p.projects" />
    <app-timeline class="experience" number="03" heading="Berufserfahrung" [entries]="p.experience" />
    <app-timeline class="education" number="04" heading="Ausbildung" [entries]="p.education" />
    <app-skills [groups]="p.skills" />
    <app-contact />
  </main>

  <footer class="no-print">© {{ p.name }} · gebaut mit Kotlin, Spring Boot und Angular</footer>
} @else {
  <p class="loading">Lade…</p>
}
