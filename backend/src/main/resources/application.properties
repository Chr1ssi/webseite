spring.application.name=backend

# Kontaktformular: SMTP-Zugang und Empfänger kommen aus Umgebungsvariablen
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
contact.recipient=${CONTACT_RECIPIENT:}
contact.sender=${CONTACT_SENDER:${MAIL_USERNAME:}}

# index.html darf nie aus dem Cache kommen, sonst zeigt sie nach einem Update auf alte Bundles
spring.web.resources.cache.cachecontrol.no-cache=true
